<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Responsive audit</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #d8d6d1; }
      iframe { display: block; border: 0; background: #ffffff; }
      iframe + iframe { margin-top: 32px; }
    </style>
  </head>
  <body>
    <iframe data-width="375" title="375px audit" src="/?audit=375" width="375" height="812"></iframe>
    <iframe data-width="768" title="768px audit" src="/?audit=768" width="768" height="1024"></iframe>
    <iframe data-width="1440" title="1440px audit" src="/?audit=1440" width="1440" height="1000"></iframe>
  </body>
</html>
